    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Suppress benign Vite HMR / WebSocket connection failures in preview iframe environment
      window.addEventListener('error', function (event) {
        var msg = (event && (event.message || (event.error && event.error.message))) || '';
        var filename = (event && event.filename) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('@vite/client') !== -1 ||
          msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          filename.indexOf('@vite/client') !== -1
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = (event && event.reason && (event.reason.message || String(event.reason))) || '';
        if (
          reason.indexOf('WebSocket') !== -1 ||
          reason.indexOf('@vite/client') !== -1 ||
          reason.indexOf('createWebSocketModuleRunnerTransport') !== -1
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
    </script>
    <title>AlphaVault Terminal — Argon-4 Autopilot & Daily Investment Analysis</title>
