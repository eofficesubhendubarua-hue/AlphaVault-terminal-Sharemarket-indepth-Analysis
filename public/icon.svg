<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with 15% safe padding for Android adaptive maskable icon -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="6" stroke-dasharray="12 12" />

  <!-- Shield Shape (Vault & Security) -->
  <path d="M256 95 L370 145 C370 260 256 360 256 385 C256 360 142 260 142 145 Z" fill="url(#shieldGrad)" filter="url(#glow)" opacity="0.9" />

  <!-- Inner Vault Diamond / Candlestick Growth Vectors -->
  <path d="M256 140 L330 240 L256 340 L182 240 Z" fill="#070b12" opacity="0.85" />
  
  <!-- Financial Growth Candlesticks & Alpha 'A' Peak -->
  <path d="M256 160 L310 240 H202 Z" fill="#ffffff" />
  <path d="M236 255 H276 V305 H236 Z" fill="#34d399" />
  <line x1="256" y1="130" x2="256" y2="160" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="305" x2="256" y2="330" stroke="#34d399" stroke-width="6" stroke-linecap="round" />

  <!-- Institutional Typography Monogram 'AV' -->
  <text x="256" y="445" font-family="'JetBrains Mono', monospace" font-size="34" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="4">ALPHAVAULT</text>
</svg>
